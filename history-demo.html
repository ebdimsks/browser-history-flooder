<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>History API デモ</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      color: #e8eef8; background: radial-gradient(ellipse at top, #23375b, #101827 60%);
    }
    main { width: min(100%, 680px); padding: clamp(24px, 5vw, 42px); border: 1px solid #34445f; border-radius: 20px; background: #172235; box-shadow: 0 24px 80px #0005; }
    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 5vw, 2.4rem); }
    p { line-height: 1.7; color: #c3cee0; }
    .notice { padding: 14px 16px; border-left: 4px solid #f6c453; border-radius: 8px; background: #332d20; color: #ffe6a3; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0; }
    button { border: 0; border-radius: 10px; padding: 12px 17px; color: #101827; background: #9dc5ff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover:not(:disabled) { background: #c0d9ff; }
    button.secondary { color: #e8eef8; background: #34445f; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .stat { padding: 15px; border-radius: 12px; background: #101827; }
    .label { display: block; color: #9eacc2; font-size: .9rem; }
    output { display: block; margin-top: 5px; font-size: 1.3rem; font-weight: 700; overflow-wrap: anywhere; }
    code { color: #c5dcff; }
    footer { margin-top: 22px; color: #9eacc2; font-size: .9rem; }
    @media (max-width: 440px) { .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>History API デモ</h1>
    <p><code>history.pushState()</code> を使って、ページ遷移せずに URL のハッシュとブラウザー履歴を更新します。動作を確認するにはボタンを押してください。</p>
    <p class="notice"><strong>安全のための制限：</strong>自動実行はせず、連続実行は最大10回・1秒間隔です。追加した履歴はブラウザーの「戻る」操作でたどれます。</p>

    <div class="controls">
      <button id="step">履歴を1件追加</button>
      <button id="start" class="secondary">ゆっくり自動実行</button>
      <button id="stop" class="secondary" disabled>停止</button>
    </div>

    <section class="stats" aria-live="polite">
      <div class="stat"><span class="label">このデモで追加した件数</span><output id="count">0 / 10</output></div>
      <div class="stat"><span class="label">現在の URL ハッシュ</span><output id="hash">(なし)</output></div>
      <div class="stat"><span class="label">状態</span><output id="status">待機中</output></div>
      <div class="stat"><span class="label">次の履歴番号</span><output id="next">1</output></div>
    </section>

    <footer>このページは単一の HTML ファイルで動作します。履歴を増やしたくない場合は、ボタンを押さずに閉じてください。</footer>
  </main>
  <script>
    (() => {
      const limit = 10;
      const intervalMs = 1000;
      const stepButton = document.querySelector('#step');
      const startButton = document.querySelector('#start');
      const stopButton = document.querySelector('#stop');
      const countOutput = document.querySelector('#count');
      const hashOutput = document.querySelector('#hash');
      const statusOutput = document.querySelector('#status');
      const nextOutput = document.querySelector('#next');
      let added = 0;
      let timer = null;
      let nextNumber = Number(location.hash.slice(1)) || 0;

      function update() {
        countOutput.value = `${added} / ${limit}`;
        hashOutput.value = location.hash || '(なし)';
        nextOutput.value = String(nextNumber + 1);
        const finished = added >= limit;
        stepButton.disabled = finished;
        startButton.disabled = finished || timer !== null;
        stopButton.disabled = timer === null;
        if (finished && timer !== null) stop();
      }

      function addEntry() {
        if (added >= limit) return;
        nextNumber += 1;
        history.pushState({ demo: true, number: nextNumber }, '', `#${nextNumber}`);
        added += 1;
        statusOutput.value = '履歴を追加しました';
        update();
      }

      function stop() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
        statusOutput.value = added >= limit ? '上限に達しました' : '停止中';
        update();
      }

      stepButton.addEventListener('click', addEntry);
      startButton.addEventListener('click', () => {
        if (timer !== null || added >= limit) return;
        statusOutput.value = '自動実行中（1秒間隔）';
        timer = setInterval(addEntry, intervalMs);
        update();
      });
      stopButton.addEventListener('click', stop);
      addEventListener('popstate', () => {
        hashOutput.value = location.hash || '(なし)';
        statusOutput.value = '履歴を移動しました';
      });
      addEventListener('hashchange', () => {
        hashOutput.value = location.hash || '(なし)';
      });
      update();
    })();
  </script>
</body>
</html>
